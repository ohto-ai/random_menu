name: ✨ 功能建议 / Feature Request
description: 建议一个新功能或改进 / Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem to Solve
      description: 这个功能能帮你解决什么？ / What would this feature help you with?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案 / Proposed Solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional Context
      description: 参考 example / reference、截图 / screenshots 等
    validations:
      required: false
