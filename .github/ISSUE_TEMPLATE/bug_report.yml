name: 🐛 Bug 报告 / Bug Report
description: 报告一个问题 / Report a problem
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 简要说明遇到了什么问题 / A clear description of the problem
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to Reproduce
      placeholder: |
        1. 打开页面 / Open the page
        2. 点击… / Click on…
        3. 出现… / See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected Behavior
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器 / Browser
      options:
        - Chrome / Edge
        - Firefox
        - Safari
        - Mobile (iOS Safari)
        - Mobile (Chrome Mobile)
        - 其他 / Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS / iPadOS
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或控制台报错 / Screenshots or Console Errors
      description: 如有帮助请附上 / Attach if helpful
    validations:
      required: false
