<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="随机菜单选择器：输入你的菜单列表，随机决定今天吃什么。支持转盘模式、排除/统计抽取、防吃腻、导入导出与 PWA 离线使用。Random menu picker — let the wheel decide what to eat today."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ff9f43" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
    <title>今天吃什么</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- ✅ Emoji Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%2214%22 font-size=%2216%22>🍱</text></svg>"
    />
  </head>
  <body>
    <div class="container" id="main-content">
      <div class="header">
        <h1 id="title">🍱 今天吃什么</h1>
        <div class="header-buttons">
          <button id="themeToggle" type="button" title="切换主题">🌓</button>
          <button id="langToggle" type="button" title="Switch Language">🌐</button>
          <a
            href="https://github.com/ohto-ai/random_menu"
            target="_blank"
            rel="noopener noreferrer"
            class="github-link"
            id="githubTooltip"
            title="查看源码"
            aria-label="GitHub"
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
          </a>
        </div>
      </div>

      <!-- App mode tabs: list / wheel -->
      <div class="mode-tabs" role="tablist" aria-label="App mode">
        <button id="listModeTab" type="button" role="tab" aria-selected="true">📜 列表模式</button>
        <button id="wheelModeTab" type="button" role="tab" aria-selected="false">
          🎡 转盘模式
        </button>
      </div>

      <!-- ============ List mode ============ -->
      <section id="listPanel">
        <label id="inputLabel" for="menuInput">请输入菜单列表（每行一个菜名）：</label>
        <div class="textarea-container">
          <textarea id="menuInput" placeholder="例：红烧肉\n鱼香肉丝\n番茄炒蛋"></textarea>
          <div class="save-status" id="saveStatus"></div>
        </div>

        <div class="menu-tools">
          <div class="tool-group">
            <label id="templateLabel" for="templateSelect">模板</label>
            <select id="templateSelect"></select>
            <button id="applyTemplateBtn" type="button">应用</button>
          </div>
          <div class="io-buttons tool-group">
            <button id="exportBtn" type="button" title="导出菜单">📤</button>
            <button id="importBtn" type="button" title="导入菜单">📥</button>
            <input type="file" id="importFile" accept=".txt,text/plain" hidden />
            <button id="shareBtn" type="button" title="复制分享链接">🔗</button>
          </div>
        </div>

        <div class="options-row">
          <p id="countText">
            <label for="count"><span id="countPrefix">每次选择</span></label>
            <input type="number" id="count" value="2" min="1" max="100" />
            <span id="countSuffix">个菜</span>
          </p>

          <p class="pick-mode-group">
            <label id="pickModeLabel" for="pickMode">抽取模式</label>
            <select id="pickMode">
              <option value="normal">普通</option>
              <option value="elimination">排除</option>
              <option value="accumulate">统计</option>
            </select>
          </p>

          <p class="anti-repeat-group">
            <input type="checkbox" id="antiRepeat" />
            <label id="antiRepeatLabel" for="antiRepeat">防吃腻</label>
            <input
              type="number"
              id="antiRepeatRange"
              value="3"
              min="1"
              max="10"
              aria-label="排除最近几次的选择"
            />
            <span id="antiRepeatUnit">次</span>
          </p>
        </div>

        <button id="startButton" type="button">🎲 开始选择</button>

        <div id="result"></div>

        <details id="statsPanel">
          <summary id="statsTitle">📊 统计</summary>
          <div id="statsList"></div>
          <div class="stats-actions">
            <button id="clearStatsBtn" type="button">清空统计</button>
          </div>
        </details>

        <div id="history">
          <div class="history-header">
            <h2 id="historyTitle">🕘 历史记录</h2>
            <button id="clearHistoryBtn" type="button">🗑 清空</button>
          </div>
          <div id="historyList" class="no-history">暂无记录</div>
        </div>
      </section>

      <!-- ============ Wheel mode ============ -->
      <section id="wheelPanel" hidden>
        <div class="wheel-wrap">
          <canvas id="wheelCanvas" role="img" aria-label="Menu wheel"></canvas>
          <div class="wheel-pointer" aria-hidden="true"></div>
          <button id="wheelCenterBtn" type="button">🎡</button>
        </div>
        <p class="wheel-hint" id="wheelHint">菜单变更会自动同步到转盘</p>
        <div id="wheelResult"></div>
      </section>
    </div>

    <div id="toast" role="status"></div>

    <script src="js/wheel.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
